project:
  name: ARES
  environment: lab

proxmox:
  endpoint: "https://CHANGE_ME:8006"
  node: CHANGE_ME
  storage: CHANGE_ME
  wan_bridge: vmbr0
  vlan_bridge: vmbr1
  verify_ssl: true

network:
  default_deny: true

  vlans:
    - id: 10
      name: MANAGEMENT
      subnet: 10.20.10.0/24
      purpose: Infrastructure administration

    - id: 20
      name: DEVELOPMENT
      subnet: 10.20.20.0/24
      purpose: Development workstations

    - id: 30
      name: BUSINESS
      subnet: 10.20.30.0/24
      purpose: Business workstations

    - id: 40
      name: SERVERS
      subnet: 10.20.40.0/24
      purpose: Internal servers

    - id: 50
      name: DMZ
      subnet: 10.20.50.0/24
      purpose: Exposed services

    - id: 60
      name: MONITORING
      subnet: 10.20.60.0/24
      purpose: Monitoring and centralized logs

    - id: 70
      name: BACKUP
      subnet: 10.20.70.0/24
      purpose: Backup infrastructure

    - id: 80
      name: GUEST
      subnet: 10.20.80.0/24
      purpose: Guest network

    - id: 99
      name: VPN
      subnet: 10.20.99.0/24
      purpose: WireGuard remote access
